# Canonical OpenCode profile: shared state RW, config RO, directory at /work.
image = "localhost/cistella/opencode:example"
credential-surface = "none"
container-home = "/home/cistella"
command = ["opencode"]

[[mounts]]
host-source = "~/.config/opencode"
container-target = "{{container-home}}/.config/opencode"
mode = "ro"

[[mounts]]
host-source = "~/.local/share/opencode"
container-target = "{{container-home}}/.local/share/opencode"
mode = "rw"

[[mounts]]
host-source = "~/.local/state/opencode"
container-target = "{{container-home}}/.local/state/opencode"
mode = "rw"
