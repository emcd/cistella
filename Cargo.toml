[package]
name = "cistella"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
default-run = "cistella"
description = "Isolates agent sessions via various technologies."
license = "Apache-2.0"
repository = "https://github.com/emcd/cistella"
homepage = "https://github.com/emcd/cistella"
keywords = [ "containers", "agent" ]
categories = [ "command-line-utilities", "development-tools" ]
include = [
    "/src/**",
    "/data/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "cistella"
path = "src/lib.rs"

[[bin]]
name = "cistella"
path = "src/main.rs"

# Test-auxiliary target: deterministic protocol peer for the conformance
# harness (task 3.1, `framework-isolators-extensions`). Lives under
# `tests/` so it stays out of `package.include` (`/src/**` is the
# published surface; `tests/**` is not). Access from other tests via
# `std::env::var("CARGO_BIN_EXE_fake_guest")` at runtime.
[[test]]
name = "fake_guest"
path = "tests/fixtures/fake_guest.rs"
harness = false


[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
nix = { version = "0.29", features = ["term", "process", "fs", "poll", "signal"] }
regex = "1.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = { version = "1.1.4", features = ["parse"] }

[dev-dependencies]
