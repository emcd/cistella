[package]
name = "cistella"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
default-run = "cistella"
description = "Isolates agent sessions via various technologies."
license = "Apache-2.0"
repository = "https://github.com/emcd/cistella"
homepage = "https://github.com/emcd/cistella"
keywords = [ "containers", "agent" ]
categories = [ "command-line-utilities", "development-tools" ]
include = [
    "/src/**",
    "/data/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "cistella"
path = "src/lib.rs"

[[bin]]
name = "cistella"
path = "src/main.rs"

# Conformance harness and live-test tooling: the deterministic
# protocol peer plus characterization probes. These are NOT
# user-facing examples — they live under `tests/` with explicit
# `[[example]]` tables so Cargo still builds each to
# `target/<profile>/examples/<name>`, where the suite resolves them
# by glob (`example_binary` / `resolve_example` /
# `landlock_helper_path`). Examples are never probed as tests by
# `cargo nextest run` (which broke the `[[test]] harness=false`
# shape via `--list` exit 2 on clap-derived argv), and `tests/`
# stays out of `package.include` either way.
# (`CARGO_BIN_EXE_<name>` is only set inside the binary that OWNS
# the example, never in sibling test binaries.)
[[example]]
name = "fake_guest"
path = "tests/fixtures/fake_guest/main.rs"

[[example]]
name = "deny_probe"
path = "tests/probes/deny_probe.rs"

[[example]]
name = "bind_alias_probe"
path = "tests/probes/bind_alias_probe.rs"

[[example]]
name = "landlock_helper"
path = "tests/probes/landlock_helper.rs"

[[example]]
name = "landlock_kill_wrapper"
path = "tests/probes/landlock_kill_wrapper.rs"

[[example]]
name = "sigpipe_probe"
path = "tests/probes/sigpipe_probe.rs"


[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
nix = { version = "0.29", features = ["term", "process", "fs", "poll", "signal", "socket", "uio"] }
regex = "1.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = { version = "1.1.4", features = ["parse"] }

[dev-dependencies]
# Helper-only — used by tests/probes/landlock_helper.rs to bind Landlock
# syscalls and by tests/unit/session_pty.rs for pty allocation;
# nothing in src/ depends on it directly (src uses nix::libc).
libc = "0.2.189"
