[package]
name = "cistella"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
default-run = "cistella"
description = "External driver for Agentmux agent development containers"
license = "Apache-2.0"
repository = "https://github.com/emcd/cistella"
homepage = "https://github.com/emcd/cistella"
keywords = [ "agentmux", "containers", "podman", "agent", "devcontainers" ]
categories = [ "command-line-utilities", "development-tools" ]
include = [
    "/src/**",
    "/data/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "cistella"
path = "src/lib.rs"

[[bin]]
name = "cistella"
path = "src/main.rs"

[[bin]]
name = "terminal-spike"
path = "src/bin/terminal-spike.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
nix = { version = "0.29", features = ["term", "process", "fs", "poll", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = { version = "1.1.4", features = ["parse"] }

[dev-dependencies]
