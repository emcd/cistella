[package]
name = "cistella"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
default-run = "cistella"
description = "Isolates agent sessions via various technologies."
license = "Apache-2.0"
repository = "https://github.com/emcd/cistella"
homepage = "https://github.com/emcd/cistella"
keywords = [ "containers", "agent" ]
categories = [ "command-line-utilities", "development-tools" ]
include = [
    "/src/**",
    "/data/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "cistella"
path = "src/lib.rs"

[[bin]]
name = "cistella"
path = "src/main.rs"

# Conformance harness: deterministic protocol peer (task 3.1,
# `framework-isolators-extensions`). Lives under `examples/` so
# Cargo autodiscovers it as an example target — examples are
# never probed as tests by `cargo nextest run` (which broke the
# `[[test]] harness=false` shape via `--list` exit 2 on clap-derived
# argv), are built to `target/<profile>/examples/`, and stay out
# of `package.include` either way. Access from other test binaries
# via glob in `target/<profile>/examples/` — `CARGO_BIN_EXE_fake_guest`
# is NOT set in sibling test binaries.
# (Cargo discovers the example automatically; no [[example]] block needed.)


[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
nix = { version = "0.29", features = ["term", "process", "fs", "poll", "signal"] }
regex = "1.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = { version = "1.1.4", features = ["parse"] }

[dev-dependencies]
