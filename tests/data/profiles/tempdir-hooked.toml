# Hooked pair profile for tempdir tests: landlock confinement
# plus the tempdir extension. Test fixture, not a baked example.
image = 'localhost/cistella/opencode:example'
credential-surface = 'none'
container-home = '/home/cistella'
command = ['sleep', 'infinity']
# The hook requires the ~/src confinement ancestor translatable
# through the mount topology; every real hooked profile mounts it.
[[mounts]]
host-source = '~/src'
container-target = '{{core:container-home}}/src'
mode = 'ro'

[[extensions]]
name = 'landlock'

[[extensions]]
name = 'tempdir-test'
