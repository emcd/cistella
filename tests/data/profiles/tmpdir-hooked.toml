# Hooked pair profile for tmpdir tests: landlock confinement
# plus the tmpdir extension. Test fixture, not a baked example.
image = 'localhost/cistella/opencode:example'
container-home = '/home/cistella'
command = ['sleep', 'infinity']
# The hook requires the ~/src confinement ancestor translatable
# through the mount topology; every real hooked profile mounts it.
[[mounts]]
host-source = '~/src'
container-target = '{{core:container-home}}/src'
mode = 'ro'

[[extensions]]
name = 'landlock'

[[extensions]]
name = 'tmpdir'
