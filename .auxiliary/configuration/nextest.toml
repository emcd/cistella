# Per-repository cargo-nextest configuration. Lives under
# `.auxiliary/configuration/` to keep all dev-tool config in one place;
# it is NOT at the default `.config/nextest.toml` autoload path, so every
# invocation must pass `--config-file .auxiliary/configuration/nextest.toml`
# explicitly. Four places currently do: pre-commit.yaml (`cargo-nextest` and
# `cargo-nextest-release` entries), tester.yaml (the `Test` step),
# documentation/development-practices.md (Pre-Commit Validation), and
# documentation/development/README.md (Local Validation). Adding a new
# invocation point? Add the flag there too, or it silently won't load.
#
# Reference: https://nexte.st/docs/configuration/

[profile.default]
# Warning only, by deliberate choice: the suite today contains tests that
# legitimately exceed 10 seconds, and `terminate-after` would convert a
# SLOW warning into a hard failure for them. Future tests over 10s will
# be flagged at introduction via the SLOW status; if a slow test is
# intended and not intended to be flagged, add it as a per-test override
# rather than raising the global threshold.
slow-timeout = "10s"
# Serial user-manager group: the lifecycle/labels/selectors/signals tests
# drive the real systemd user manager and podman under one HOME registry
# and one creation lock. Running them concurrently makes every test's `gc`
# reap every other test's orphans and minted id prefixes collide, so
# default validation flakes. The serial group makes the wall time the
# honest sum; the Operator's suite-wall todo (cistella:todos/10) optimises
# from this stable baseline. Unit tests stay parallel in the default group.

[test-groups.user-manager]
max-threads = 1

[[profile.default.overrides]]
filter = "binary(integration)"
test-group = "user-manager"
