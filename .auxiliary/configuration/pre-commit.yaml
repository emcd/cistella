# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_install_hook_types: [ 'pre-commit', 'pre-push', 'pre-merge-commit' ]

repos:

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
    name: 'Check: Large Files'
  - id: check-case-conflict
    name: 'Check: Filename Case Conflict'
  - id: check-merge-conflict
    name: 'Check: Merge Conflict Markers'
  - id: check-symlinks
    name: 'Check: Dangling Symlinks'
  - id: check-vcs-permalinks
    name: 'Check: VCS Permalinks'
  - id: destroyed-symlinks
    name: 'Check: Destroyed Symlinks'
  - id: detect-private-key
    name: 'Check: Detect Private Keys'
  - id: mixed-line-ending
    name: 'Check: Detect Mixed Line Endings'
    args: [ '--fix', 'no' ]
  - id: check-json
    name: 'Validate: JSON Files'
  - id: check-toml
    name: 'Validate: TOML Files'
  - id: check-yaml
    name: 'Validate: YAML Files'
  - id: end-of-file-fixer
    name: 'Fix: End of Files'
  - id: trailing-whitespace
    name: 'Fix: Trailing Whitespace'

- repo: local
  hooks:

  - id: cargo-clippy
    name: 'Lint (Rust: Clippy)'
    language: system
    entry: 'cargo clippy --all-targets --no-default-features -- -D warnings'
    pass_filenames: false
    require_serial: true
    stages: [ 'pre-commit', 'pre-merge-commit' ]
    fail_fast: true

  - id: cargo-fmt
    name: 'Check Style (Rust)'
    language: system
    entry: 'cargo fmt --all -- --check'
    pass_filenames: false
    require_serial: true
    stages: [ 'pre-commit', 'pre-merge-commit' ]
    fail_fast: true

  - id: linecheck
    name: 'Check: Line Counts'
    language: system
    entry: 'linecheck --config .auxiliary/configuration/linecheck.yaml src tests'
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [ 'pre-commit', 'pre-merge-commit' ]
    fail_fast: true

  - id: cargo-nextest
    name: 'Test (Rust: cargo-nextest)'
    language: system
    entry: "bash -c 'test -f Cargo.lock || cargo generate-lockfile; exec cargo nextest run --no-default-features --locked --no-tests=warn --config-file .auxiliary/configuration/nextest.toml'"
    pass_filenames: false
    require_serial: true
    stages: [ 'pre-commit', 'pre-merge-commit' ]
    fail_fast: true
    verbose: true
  - id: cargo-doctest
    name: 'Test (Rust: doctests)'
    language: system
    entry: "bash -c 'test -f Cargo.lock || cargo generate-lockfile; exec cargo test --doc --locked'"
    pass_filenames: false
    require_serial: true
    stages: [ 'pre-commit', 'pre-merge-commit' ]
    fail_fast: true
  - id: cargo-build-release
    name: 'Build (Rust: release)'
    language: system
    entry: "bash -c 'test -f Cargo.lock || cargo generate-lockfile; exec cargo build --release --locked --all-targets --no-default-features'"
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [ 'pre-push' ]
    fail_fast: true
  - id: cargo-nextest-release
    name: 'Test (Rust: cargo-nextest, release)'
    language: system
    # Project-owned flags (cistella): project nextest config plus the live
    # profile gate (the pre-push live suite).
    entry: "bash -c 'test -f Cargo.lock || cargo generate-lockfile; exec cargo nextest run --no-default-features --release --locked --config-file .auxiliary/configuration/nextest.toml -P live --run-ignored=all'"
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [ 'pre-push' ]
    fail_fast: true
    verbose: true
  - id: cargo-doctest-release
    name: 'Test (Rust: doctests, release)'
    language: system
    entry: "bash -c 'test -f Cargo.lock || cargo generate-lockfile; exec cargo test --doc --release --locked'"
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [ 'pre-push' ]
    fail_fast: true
