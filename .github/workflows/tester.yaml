name: qa

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['master', 'release-*']
  workflow_dispatch:
    inputs:
      # QA-DIAG (temporary): substring filter appended to the nextest
      # invocation for scoped diagnostic reruns (e.g. `protocol::`).
      # Empty (default) runs the full suite unchanged.
      test-filter:
        description: 'Nextest test-name filter (empty = full suite)'
        required: false
        default: ''
        type: string
      # QA-DIAG (temporary): run the 26.04 exec-death spike steps
      # (strace one failing test + fork-pattern death count) after
      # the suite. Default off; enable per-dispatch for diagnosis.
      spike-exec:
        description: 'Run 26.04 exec-death spike steps after tests'
        required: false
        default: false
        type: boolean

jobs:

  initialize:
    uses: ./.github/workflows/core--initializer.yaml

  lint:
    needs: [initialize]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        # System-language hooks (cargo fmt/clippy, linecheck built from
        # source) need a toolchain before pre-commit runs.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.initialize.outputs.rust-toolchain }}
          components: rustfmt, clippy

      - name: Install linecheck
        # Pinned to the same version this project develops against locally.
        # `linecheck` is not a repository dependency (it is not a runtime
        # dependency of the crate and is not in `Cargo.toml`), so the host
        # runner must install it explicitly. Bumping the version is a workflow
        # edit, intentionally separate from a hook change, so a binary
        # upgrade does not silently widen enforcement.
        run: cargo install linecheck --locked --version 1.2.1

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        # CI runs the SAME pre-commit config developers run locally
        # (`.auxiliary/configuration/pre-commit.yaml`), so the workflow
        # never drifts from the hooks. This replaces the previously
        # explicit fmt/clippy/linecheck/fast-test steps, which duplicated
        # every flags change in two places. Runs once (not per matrix
        # element): every hook here is platform-independent, and the
        # matrix test job below carries the platform signal. The test
        # job stays explicit (matrix + env need native steps). Skips the
        # fast test hook: the matrix test job below runs the full suite
        # (live profile includes the fast tests), so each suite runs
        # exactly once.
        env:
          SKIP: 'cargo-nextest'
        run: pre-commit run --all-files --config .auxiliary/configuration/pre-commit.yaml

      - name: Verify Published Package
        # Packages and compiles the extracted crate, catching files omitted by
        # Cargo.toml's explicit include allowlist before a release tag does.
        run: cargo package

  test:
    needs: [initialize, lint]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.initialize.outputs.platforms) }}
        exclude: ${{ fromJSON(needs.initialize.outputs.matrix-exclusions) }}
    runs-on: ${{ matrix.platform }}
    # 26.04 legs run advisory-only while green-rate evidence accumulates
    # (pilot discipline): signal without blocking merges. Promote to
    # required by dropping this override once the pilot proves out.
    continue-on-error: ${{ contains(matrix.platform, '26.04') }}
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.initialize.outputs.rust-toolchain }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9

      - name: Enable systemd lingering
        # Live sessions run under the runner user's systemd user
        # manager; lingering starts it without an active login.
        run: sudo loginctl enable-linger "$USER"

      - name: Install Podman
        # Rootless sessions need the engine plus subordinate-ID tooling.
        run: sudo apt-get update && sudo apt-get install -y podman uidmap

      - name: Verify session prerequisites
        # Fails the job early with a readable error when the runner
        # cannot host sessions, instead of one 60s timeout per test.
        run: |
          set -eu
          podman --version
          systemctl --user is-system-running --wait

      - name: Build example images
        # Live tests conduct against `localhost/cistella/opencode:example`
        # and refuse to pull implicitly: the image must exist locally.
        # `validate.sh` builds each example and verifies baked terminfo
        # plus harness discovery (same script maintainers run).
        run: ./data/dockerfiles/validate.sh

      - name: Build
        run: cargo build --release --locked

      - name: Test (live profile)
        # Runs the FULL suite including the live tier (`-P live
        # --run-ignored=all`), mirroring the pre-push hook. Whether
        # hosted runners can actually satisfy it (systemd user manager
        # plus rootless Podman) is unproven: systemd-guarded tests skip
        # where no user manager answers, and podman absence may fail
        # unguarded tests outright. Until the hosted experiment proves
        # out, the authoritative live gate stays the host pre-push hook
        # (self-hosted runner tracked in todos/27) — a green CI run
        # must never be mistaken for live coverage there.
        # `--no-fail-fast`: one flake must not hide the other results —
        # a fail-fast stop at the first failure destroyed most of the
        # signal in the arm live-tier failure it was tried against.
        env:
          RUST_BACKTRACE: '1'
        run: cargo nextest run --release --locked --config-file .auxiliary/configuration/nextest.toml -P live --run-ignored=all --no-fail-fast ${{ inputs.test-filter }}

      - name: Kernel ring tail
        # QA-DIAG (temporary): OOM-killer and segfault lines for the
        # guest-early-death diagnosis. Best effort, always runs.
        if: always()
        run: sudo dmesg 2>/dev/null | tail -40 || echo "(dmesg unavailable)"

      - name: Spike strace one failing test
        # QA-DIAG (temporary): guest-identity prelude (ldd, file,
        # smoke exit codes — names what /bin/sleep and /bin/cat
        # actually are on this image) plus process/dup/exec trace
        # with the FULL guest section (argv completeness, loader
        # behavior, exit path — no truncation).
        # Runs when inputs.spike-exec is true, even if tests failed
        # (always() — the trace is most needed exactly then).
        if: always() && inputs.spike-exec
        run: |
          set -eu
          command -v strace || { sudo apt-get update && sudo apt-get install -y strace; }
          echo "--- guest identity ---"
          readlink -f /bin/sleep /bin/cat
          file /bin/sleep /bin/cat || true
          ldd /bin/sleep 2>&1 | head -8 || true
          /bin/sleep 0.05; echo "sleep-smoke-exit=$?"
          echo "/bin/true" | /bin/cat; echo "cat-smoke-exit=$?"
          cargo test --release --locked --test unit --no-run 2>&1 | tail -1
          BIN="$(ls -t target/release/deps/unit-* | grep -vE '\.(d|rlib|rmeta)$' | head -1)"
          echo "tracing: $BIN"
          strace -f -e trace=process,dup,dup2,fcntl,close,close_range,execve,open,openat,read,write,exit_group -o /tmp/strace-cat.log "$BIN" protocol::slow_guest_times_out_and_reaps --exact --nocapture || true
          echo "--- full guest section ---"
          python3 - <<'PYEOF'
          import re
          txt = open('/tmp/strace-cat.log', errors='replace').read()
          lines = txt.split('\n')
          start = None
          gpid = None
          for i, ln in enumerate(lines):
              m = re.match(r'(\d+)\s+execve\("/proc/self/fd/\d+"', ln)
              if m:
                  start = i
                  gpid = m.group(1)
                  print(f"guest pid={gpid}: {ln.strip()[:160]}")
                  break
          if start is not None:
              shown = 0
              for ln in lines[start+1:]:
                  if re.match(rf'{gpid}\s', ln):
                      print(ln.strip()[:220])
                      shown += 1
                      if shown >= 120:
                          break
          PYEOF

      - name: Spike fork-pattern death count
        # QA-DIAG (temporary): 2000x plain fork+exec vs exact
        # GuestHost pattern (O_RDONLY open, CLOEXEC-clear, setpgid,
        # exec /proc/self/fd/N) with pipe stdio. (ii)-only deaths
        # implicate our setup; both implicate kernel/image below;
        # neither implicates the harness above. Runs with always()
        # for the same reason as the strace step.
        if: always() && inputs.spike-exec
        run: |
          python3 - <<'PYEOF'
          import fcntl, os, time
          from collections import Counter
          N = 2000
          WINDOW = 0.025
          def await_death(pid):
              end = time.time() + WINDOW
              while time.time() < end:
                  done, status = os.waitpid(pid, os.WNOHANG)
                  if done:
                      return ('dead', os.waitstatus_to_exitcode(status))
                  time.sleep(0.002)
              os.kill(pid, 9)
              _, status = os.waitpid(pid, 0)
              return ('alive', os.waitstatus_to_exitcode(status))
          def pipes():
              r_in, w_in = os.pipe()
              r_out, w_out = os.pipe()
              r_err, w_err = os.pipe()
              return (r_in, w_in, r_out, w_out, r_err, w_err)
          def close_many(fds):
              for fd in fds:
                  try:
                      os.close(fd)
                  except OSError:
                      pass
          def trial_plain():
              r_in, w_in, r_out, w_out, r_err, w_err = pipes()
              pid = os.fork()
              if pid == 0:
                  try:
                      os.dup2(r_in, 0)
                      os.dup2(w_out, 1)
                      os.dup2(w_err, 2)
                      os.execv('/bin/cat', ['cat'])
                  except Exception:
                      os._exit(127)
              close_many((r_in, w_out, w_err))
              fate = await_death(pid)
              close_many((w_in, r_out, r_err))
              return fate
          def trial_pattern():
              r_in, w_in, r_out, w_out, r_err, w_err = pipes()
              f = os.open('/bin/cat', os.O_RDONLY)
              pid = os.fork()
              if pid == 0:
                  try:
                      flags = fcntl.fcntl(f, fcntl.F_GETFD)
                      fcntl.fcntl(f, fcntl.F_SETFD, flags & ~fcntl.FD_CLOEXEC)
                      os.setpgid(0, 0)
                      os.dup2(r_in, 0)
                      os.dup2(w_out, 1)
                      os.dup2(w_err, 2)
                      os.execv(f'/proc/self/fd/{f}', ['cat'])
                  except Exception:
                      os._exit(127)
              os.close(f)
              close_many((r_in, w_out, w_err))
              fate = await_death(pid)
              close_many((w_in, r_out, r_err))
              return fate
          for name, fn in (('plain', trial_plain), ('pattern', trial_pattern)):
              counts = Counter()
              for _ in range(N):
                  counts[fn()] += 1
              print(f'{name}: {dict(counts)}', flush=True)
          PYEOF
