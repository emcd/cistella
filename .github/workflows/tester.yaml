name: qa

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['master', 'release-*']
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:

  initialize:
    uses: ./.github/workflows/common-initializer.yaml
    permissions: {}

  gates-dev:
    needs: [initialize, hygiene]
    permissions:
      contents: read
    uses: emcd/rust-project-common/.github/workflows/xrepo--tester.yaml@gha-1
    with:
      platforms: ${{ needs.initialize.outputs.platforms }}
      cargo-profile: dev
      has-library: true

  gates-release:
    needs: [initialize, hygiene]
    permissions:
      contents: read
    uses: emcd/rust-project-common/.github/workflows/xrepo--tester.yaml@gha-1
    with:
      platforms: ${{ needs.initialize.outputs.platforms }}
      cargo-profile: release
      has-library: true

  # Dedicated file-hygiene runner: the single sanctioned exception to running
  # no pre-commit in CI. Hook IDs are enumerated explicitly; copiertv keeps
  # this list identical to the template pre-commit configuration.
  hygiene:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

      - name: Check Out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pre-commit
        run: pipx install pre-commit==4.6.2

      - name: Check Large Files
        run: pre-commit run check-added-large-files --config .auxiliary/configuration/pre-commit.yaml --hook-stage pre-commit --all-files --show-diff-on-failure

      - name: Check Filename Case Conflict
        run: pre-commit run check-case-conflict --config .auxiliary/configuration/pre-commit.yaml --hook-stage pre-commit --all-files --show-diff-on-failure

      - name: Check Merge Conflict Markers
        run: pre-commit run check-merge-conflict --config .auxiliary/configuration/pre-commit.yaml --hook-stage pre-commit --all-files --show-diff-on-failure

      - name: Check Dangling Symlinks
        run: pre-commit run check-symlinks --config .auxiliary/configuration/pre-commit.yaml --hook-stage pre-commit --all-files --show-diff-on-failure

      - name: Check VCS Permalinks
        run: pre-commit run check-vcs-permalinks --config .auxiliary/configuration/pre-commit.yaml --hook-stage pre-commit --all-files --show-diff-on-failure

      - name: Check Destroyed Symlinks
        run: pre-commit run destroyed-symlinks --config .auxiliary/configuration/pre-commit.yaml --hook-stage pre-commit --all-files --show-diff-on-failure

      - name: Check Private Keys
        run: pre-commit run detect-private-key --config .auxiliary/configuration/pre-commit.yaml --hook-stage pre-commit --all-files --show-diff-on-failure

      - name: Check Mixed Line Endings
        run: pre-commit run mixed-line-ending --config .auxiliary/configuration/pre-commit.yaml --hook-stage pre-commit --all-files --show-diff-on-failure

      - name: Validate JSON Files
        run: pre-commit run check-json --config .auxiliary/configuration/pre-commit.yaml --hook-stage pre-commit --all-files --show-diff-on-failure

      - name: Validate TOML Files
        run: pre-commit run check-toml --config .auxiliary/configuration/pre-commit.yaml --hook-stage pre-commit --all-files --show-diff-on-failure

      - name: Validate YAML Files
        run: pre-commit run check-yaml --config .auxiliary/configuration/pre-commit.yaml --hook-stage pre-commit --all-files --show-diff-on-failure

      - name: Fix End of Files
        run: pre-commit run end-of-file-fixer --config .auxiliary/configuration/pre-commit.yaml --hook-stage pre-commit --all-files --show-diff-on-failure

      - name: Fix Trailing Whitespace
        run: pre-commit run trailing-whitespace --config .auxiliary/configuration/pre-commit.yaml --hook-stage pre-commit --all-files --show-diff-on-failure

  # Consumer-owned gates live in ./.github/workflows/local--tester.yaml
  # (authored by the consumer, never rendered by the template). This job
  # calls it as an independent gate alongside the template gates. Job-level
  # uses: reusable workflows cannot be invoked from a step.
  custom:
    needs: [initialize]
    permissions:
      contents: read
    uses: ./.github/workflows/local--tester.yaml
    with:
      platforms: ${{ needs.initialize.outputs.platforms }}
      cargo-profile: dev

  final-gate:
    needs: [gates-dev, gates-release, hygiene, custom]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:

      - name: Evaluate Gate Results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os, sys; needs = json.loads(os.environ["NEEDS_JSON"]); bad = {k: v.get("result") for k, v in needs.items() if v.get("result") != "success"}; sys.exit("failing gates: %s" % bad if bad else print("all gate jobs succeeded"))'
        shell: bash
