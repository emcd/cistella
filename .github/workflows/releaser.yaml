name: release

on:
  push:
    tags: ['v[0-9]+.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Skip artifact upload and publishing (test build only)'
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:

  initialize:
    uses: ./.github/workflows/core--initializer.yaml

  test:
    needs: [initialize]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.initialize.outputs.platforms) }}
        exclude: ${{ fromJSON(needs.initialize.outputs.matrix-exclusions) }}
    runs-on: ${{ matrix.platform }}
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.initialize.outputs.rust-toolchain }}
          components: rustfmt, clippy

      - name: Check Formatting
        if: matrix.platform == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: matrix.platform == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9

      - name: Enable systemd lingering
        # Live sessions run under the runner user's systemd user
        # manager; lingering starts it without an active login.
        # (Same runner setup as the qa workflow.)
        run: sudo loginctl enable-linger "$USER"

      - name: Install Podman
        # Rootless sessions need the engine plus subordinate-ID tooling.
        run: sudo apt-get update && sudo apt-get install -y podman uidmap

      - name: Verify session prerequisites
        # Fails the job early with a readable error when the runner
        # cannot host sessions, instead of one 60s timeout per test.
        run: |
          set -eu
          podman --version
          systemctl --user is-system-running --wait

      - name: Build example images
        # Live tests conduct against `localhost/cistella/opencode:example`
        # and refuse to pull implicitly: the image must exist locally.
        run: ./data/dockerfiles/validate.sh

      - name: Test (live profile)
        # Same live-tier caveat as the qa workflow: hosted runners are
        # unproven ground for systemd user sessions plus rootless
        # Podman, so the authoritative live gate stays the host
        # pre-push hook until a self-hosted runner exists.
        env:
          RUST_BACKTRACE: '1'
        run: cargo nextest run --release --locked --config-file .auxiliary/configuration/nextest.toml -P live --run-ignored=all

  pre-push:
    # The release workflow is a superset of the qa workflow: in addition
    # to the matrix test above, it runs the full pre-push hook suite
    # (release build + live tier) from the same pre-commit config
    # developers run locally.
    needs: [initialize, test]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.initialize.outputs.rust-toolchain }}
          components: rustfmt, clippy

      - name: Install linecheck
        run: cargo install linecheck --locked --version 1.2.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-push hooks
        # Skips the live-test hook: the matrix test job above already
        # runs the full live suite, so each suite runs exactly once.
        # What remains here is the release build gate.
        env:
          SKIP: 'cargo-nextest-release'
        run: pre-commit run --hook-stage pre-push --all-files --config .auxiliary/configuration/pre-commit.yaml

  build-binaries:
    needs: [initialize, test, pre-push]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.initialize.outputs.platforms) }}
        exclude: ${{ fromJSON(needs.initialize.outputs.matrix-exclusions) }}
    runs-on: ${{ matrix.platform }}
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.initialize.outputs.rust-toolchain }}

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Determine Binary Name
        id: binary
        shell: bash
        run: |
          target="${{ fromJSON(needs.initialize.outputs.rust-targets)[matrix.platform] }}"
          binary_name="cistella-${target}"
          cp target/release/cistella "${binary_name}"
          echo "name=${binary_name}" >>${GITHUB_OUTPUT}

      - name: Upload Binary Artifact
        if: ${{ !inputs.dry-run }}
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}
          path: ${{ steps.binary.outputs.name }}

  # publish-crates-io: commented out until after the first manual
  # `cargo publish` establishes the crate and the GitHub→crates.io OIDC
  # flow. Uncomment for v0.2.0 onwards.
  #publish-crates-io:
  #  if: ${{ !inputs.dry-run && startsWith(github.ref, 'refs/tags/') }}
  #  needs: [test]
  #  runs-on: ubuntu-latest
  #  environment: crates-io
  #  permissions:
  #    id-token: write
  #  steps:
  #
  #    - name: Checkout
  #      uses: actions/checkout@v6
  #
  #    - name: Install Rust
  #      uses: dtolnay/rust-toolchain@stable
  #      with:
  #        toolchain: ${{ needs.initialize.outputs.rust-toolchain }}
  #
  #    - name: Authenticate with crates.io
  #      uses: rust-lang/crates-io-auth-action@v1.0.4
  #      id: auth
  #
  #    - name: Publish to crates.io
  #      env:
  #        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  #      run: cargo publish --locked

  publish-github:
    if: ${{ !inputs.dry-run && startsWith(github.ref, 'refs/tags/') }}
    needs: [initialize, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Download All Binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Generate Checksums
        working-directory: artifacts
        run: |
          shopt -s nullglob
          sha256sum cistella-* >SHA256SUMS.txt

      - name: Attest Build Provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/SHA256SUMS.txt
            artifacts/cistella-*

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' \
            --repo '${{ github.repository }}' \
            --generate-notes

      - name: Upload Release Artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.ref_name }}' \
            artifacts/* \
            --repo '${{ github.repository }}'
