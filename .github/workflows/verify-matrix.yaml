name: verify-matrix

# Full live-suite run per platform for release-gate records. Manual
# dispatch from a temporary QA branch; not part of the gate.
# Run manually per platform set when Owner requests matrix numbers.

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Nextest -E filter for a targeted run (empty = full suite)'
        required: false
        default: ''

jobs:

  suite:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-24.04", "ubuntu-24.04-arm", "ubuntu-26.04", "ubuntu-26.04-arm"]
    runs-on: ${{ matrix.platform }}
    steps:

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@nextest

      - name: Runner user manager and podman socket
        # Mirrors tester.yaml's session prerequisites: lingering starts
        # the user manager, the wait fails the job early with a readable
        # error instead of one 60s timeout per test, and the example
        # images must exist locally (live tests refuse implicit pulls).
        # A past revision without the image build hung the suite for
        # 3h+ with zero streamed output; never drop these lines.
        run: |
          set -eu
          sudo loginctl enable-linger "$USER"
          systemctl --user start podman.socket
          systemctl --user is-system-running --wait
          podman --version

      - name: Build example images
        run: ./data/dockerfiles/validate.sh

      - name: Full live suite
        # Streamed, not tailed: a blinding pipe hid a 3h hang once.
        # pipefail: without it the shell reports tee's status and
        # a failed suite exits 0 — a green matrix record must
        # mean green tests, never a masked failure.
        # A non-empty filter input runs one targeted cohort with
        # immediate per-test output (marker capture for
        # capability-probe tests whose PASS alone proves nothing).
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.filter }}" ]; then
            cargo nextest run \
              --config-file .auxiliary/configuration/nextest.toml \
              -P live --run-ignored=all \
              -E "${{ inputs.filter }}" \
              --success-output=immediate 2>&1 | tee suite.log
          else
            cargo nextest run \
              --config-file .auxiliary/configuration/nextest.toml \
              -P live --run-ignored=all --no-fail-fast 2>&1 | tee suite.log
          fi
