name: spike-26-04-exec

# TEMPORARY diagnostic for the 26.04 guest-early-death quartet. Revert
# after diagnosis lands. Two jobs, both read-only apart from temp
# containers/files they create and remove:
# - strace-cat: strace one failing test (process/dup/exec syscalls).
# - pyloop: 2000x plain fork+exec vs exact-pattern spawn on 26.04.
#   (ii)-only deaths implicate our setup; both implicate kernel/image;
#   neither implicates the harness above.

on:
  workflow_dispatch: {}

jobs:

  strace-cat:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-26.04", "ubuntu-26.04-arm"]
    runs-on: ${{ matrix.platform }}
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install strace
        run: command -v strace || { sudo apt-get update && sudo apt-get install -y strace; }

      - name: Build test binary
        run: cargo test --release --locked --test unit --no-run 2>&1 | tail -2

      - name: Strace one failing test
        # Trace process/fd/exec syscalls only; the failing hello dies
        # in milliseconds, so the log stays small.
        run: |
          set -eu
          BIN="$(ls -t target/release/deps/unit-* | grep -vE '\.(d|rlib|rmeta)$' | head -1)"
          echo "tracing: $BIN"
          strace -f -e trace=process,dup,dup2,fcntl,close,close_range,execve -o /tmp/strace-cat.log "$BIN" protocol::cat_loopback_negotiates_and_round_trips --exact --nocapture || true
          echo "--- execve/exit lines ---"
          grep -E "execve|exit_group|+++ exited|--- SIG" /tmp/strace-cat.log | head -30 || true

      - name: Upload full trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strace-cat-${{ matrix.platform }}
          path: /tmp/strace-cat.log
          retention-days: 3

  pyloop:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-26.04", "ubuntu-26.04-arm"]
    runs-on: ${{ matrix.platform }}
    steps:

      - name: Fork-pattern death count
        # (i) plain fork+exec of /bin/cat with pipe stdio; (ii) the
        # exact GuestHost pattern (O_RDONLY open, CLOEXEC-clear,
        # setpgid, exec /proc/self/fd/N). 2000 trials each; a live
        # child is SIGKILLed after the poll window and counted alive.
        run: |
          python3 - <<'PYEOF'
          import fcntl, os, select, sys, time

          N = 2000
          WINDOW = 0.025

          def await_death(pid, window=WINDOW):
              end = time.time() + window
              while time.time() < end:
                  done, status = os.waitpid(pid, os.WNOHANG)
                  if done:
                      return ('dead', os.waitstatus_to_exitcode(status))
                  time.sleep(0.002)
              os.kill(pid, 9)
              _, status = os.waitpid(pid, 0)
              return ('alive', os.waitstatus_to_exitcode(status))

          def stdio_pipes():
              r_in, w_in = os.pipe()    # child stdin
              r_out, w_out = os.pipe()  # child stdout
              r_err, w_err = os.pipe()  # child stderr
              return (r_in, w_in, r_out, w_out, r_err, w_err)

          def trial_plain():
              pipes = stdio_pipes()
              r_in, w_in, r_out, w_out, r_err, w_err = pipes
              pid = os.fork()
              if pid == 0:
                  try:
                      os.dup2(r_in, 0)
                      os.dup2(w_out, 1)
                      os.dup2(w_err, 2)
                      os.execv('/bin/cat', ['cat'])
                  except Exception:
                      os._exit(127)
              for fd in (r_in, w_out, w_err):
                  os.close(fd)
              fate = await_death(pid)
              for fd in (w_in, r_out, r_err):
                  try:
                      os.close(fd)
                  except OSError:
                      pass
              return fate

          def trial_pattern():
              pipes = stdio_pipes()
              r_in, w_in, r_out, w_out, r_err, w_err = pipes
              f = os.open('/bin/cat', os.O_RDONLY)
              pid = os.fork()
              if pid == 0:
                  try:
                      flags = fcntl.fcntl(f, fcntl.F_GETFD)
                      fcntl.fcntl(f, fcntl.F_SETFD, flags & ~fcntl.FD_CLOEXEC)
                      os.setpgid(0, 0)
                      os.dup2(r_in, 0)
                      os.dup2(w_out, 1)
                      os.dup2(w_err, 2)
                      os.execv(f'/proc/self/fd/{f}', ['cat'])
                  except Exception:
                      os._exit(127)
              os.close(f)
              for fd in (r_in, w_out, w_err):
                  os.close(fd)
              fate = await_death(pid)
              for fd in (w_in, r_out, r_err):
                  try:
                      os.close(fd)
                  except OSError:
                      pass
              return fate

          for name, fn in (('plain', trial_plain), ('pattern', trial_pattern)):
              from collections import Counter
              counts = Counter()
              for _ in range(N):
                  counts[fn()] += 1
              print(f'{name}: {dict(counts)}', flush=True)
          PYEOF
